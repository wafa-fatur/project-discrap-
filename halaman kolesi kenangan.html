<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mulai Kenanganmu | DiScrap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAFA;
            background-image: 
                linear-gradient(90deg, rgba(200,200,200,0.1) 1px, transparent 1px),
                linear-gradient(rgba(200,200,200,0.1) 1px, transparent 1px);
            background-size: 40px 40px; /* Tekstur kertas kotak-kotak buku gambar */
        }
        .font-handwriting { font-family: 'Caveat', cursive; }
        
        .empty-slot {
            border: 2px dashed #E5E7EB;
            transition: all 0.4s ease;
            background: rgba(255, 255, 255, 0.5);
        }
        .empty-slot:hover {
            border-color: #38bdf8;
            background: #f0f9ff;
            transform: scale(1.02);
        }
        .shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="text-gray-800">

    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto">
        <h1 class="text-3xl font-handwriting font-bold text-sky-400">DiScrap.</h1>
        <div class="space-x-4">
            <button class="text-sm font-semibold text-gray-500 hover:text-sky-500 transition">Masuk</button>
            <button class="bg-sky-400 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md hover:bg-sky-500 transition">Daftar Gratis</button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-12">
        
        <div class="text-center mb-16">
            <h2 class="text-4xl md:text-5xl font-handwriting mb-4">Kanvas Kosong untuk Ceritamu.</h2>
            <p class="text-gray-400 max-w-lg mx-auto">Sepertinya kamu belum memiliki koleksi. Mulai buat jurnal pertamamu dan abadikan momen berhargamu di sini.</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">
            
            <div class="empty-slot aspect-[4/5] rounded-xl flex flex-col items-center justify-center p-8 cursor-pointer group shadow-sm">
                <div class="w-20 h-20 rounded-full border-2 border-sky-200 flex items-center justify-center mb-6 group-hover:bg-sky-400 group-hover:border-sky-400 transition-all duration-300">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-sky-300 group-hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </div>
                <p class="font-handwriting text-2xl text-gray-400 group-hover:text-sky-500">Mulai Jurnal Baru</p>
                <span class="text-[10px] text-gray-300 uppercase tracking-widest mt-2">Klik untuk mengunggah</span>
            </div>

            <div class="p-4 rounded-xl border border-gray-100 bg-white/40 opacity-60 flex flex-col shadow-sm">
                <div class="w-full h-2/3 shimmer rounded-lg mb-4"></div>
                <div class="h-6 w-3/4 shimmer rounded mb-2"></div>
                <div class="h-4 w-1/2 shimmer rounded"></div>
            </div>

            <div class="hidden sm:flex p-4 rounded-xl border border-gray-100 bg-white/40 opacity-40 flex-col shadow-sm">
                <div class="w-full h-2/3 shimmer rounded-lg mb-4"></div>
                <div class="h-6 w-3/4 shimmer rounded mb-2"></div>
                <div class="h-4 w-1/2 shimmer rounded"></div>
            </div>

        </div>

        <div class="fixed bottom-10 left-1/2 transform -translate-x-1/2 w-[90%] max-w-md bg-white border border-sky-100 shadow-2xl p-6 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="bg-sky-50 p-3 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <p class="text-sm font-medium text-gray-600">Simpan kenanganmu secara permanen!</p>
            </div>
            <button class="text-sky-500 font-bold text-sm hover:underline">Masuk</button>
        </div>

    </main>

</body>
</html>

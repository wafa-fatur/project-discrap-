<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrapbook Editor - DiScrap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-handwriting { font-family: 'Dancing Script', cursive; }
        .canvas-dot {
            background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .washi-tape {
            background: rgba(186, 230, 253, 0.5);
            transform: rotate(-5deg);
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">

    <div class="flex h-screen overflow-hidden">
        <aside class="w-20 bg-white border-r border-sky-100 flex flex-col items-center py-6 space-y-8 shadow-sm">
            <div class="text-2xl font-handwriting text-sky-500">Di</div>
            <nav class="space-y-6">
                <button class="p-3 rounded-xl hover:bg-sky-50 text-slate-400 hover:text-sky-500 transition">🏠</button>
                <button class="p-3 rounded-xl bg-sky-50 text-sky-500 transition">🎨</button>
                <button class="p-3 rounded-xl hover:bg-sky-50 text-slate-400 hover:text-sky-500 transition">👥</button>
            </nav>
        </aside>

        <aside class="w-80 bg-white border-r border-sky-50 flex flex-col shadow-sm">
            <div class="p-6 border-b border-sky-50">
                <h2 class="font-semibold text-slate-700">Elemen Kreatif</h2>
                <p class="text-xs text-slate-400">Tarik elemen ke dalam kanvas</p>
            </div>
            
            <div class="p-4 space-y-6 overflow-y-auto">
                <div>
                    <h3 class="text-xs font-bold text-sky-400 uppercase tracking-widest mb-3">Foto Terbaru</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="aspect-square bg-slate-100 rounded-lg overflow-hidden border-2 border-white shadow-sm cursor-move hover:scale-105 transition">
                            <img src="https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&q=80&w=150" class="w-full h-full object-cover">
                        </div>
                        <div class="aspect-square bg-slate-100 rounded-lg overflow-hidden border-2 border-white shadow-sm cursor-move hover:scale-105 transition">
                            <img src="https://images.unsplash.com/photo-1521791136064-7986c2923216?auto=format&fit=crop&q=80&w=150" class="w-full h-full object-cover">
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-sky-400 uppercase tracking-widest mb-3">Stiker & Washi Tape</h3>
                    <div class="flex flex-wrap gap-2">
                        <div class="px-4 py-1 washi-tape text-[10px] font-bold text-sky-700 cursor-move border border-sky-200">MEMORIES</div>
                        <div class="w-10 h-10 bg-yellow-100 rounded-full flex items-center justify-center cursor-move text-xl">✨</div>
                        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center cursor-move text-xl">🌸</div>
                        <div class="w-10 h-10 bg-pink-100 rounded-full flex items-center justify-center cursor-move text-xl">🎀</div>
                    </div>
                </div>

                <div>
                    <h3 class="text-xs font-bold text-sky-400 uppercase tracking-widest mb-3">Teks</h3>
                    <button class="w-full py-3 border-2 border-dashed border-sky-100 rounded-xl text-sky-500 font-handwriting hover:bg-sky-50 transition">
                        + Tambah Tulisan Tangan
                    </button>
                </div>
            </div>
        </aside>

        <main class="flex-1 relative flex flex-col">
            <div class="absolute top-6 left-1/2 -translate-x-1/2 z-20 bg-white/90 backdrop-blur px-6 py-2 rounded-full shadow-sm border border-sky-100 flex items-center space-x-6">
                <div class="flex items-center space-x-2 border-r pr-6 border-sky-100">
                    <span class="text-xs font-medium text-slate-500">Zoom:</span>
                    <span class="text-xs font-bold text-sky-600">85%</span>
                </div>
                <div class="flex space-x-4">
                    <button class="text-slate-400 hover:text-sky-500 transition text-sm">Undo</button>
                    <button class="text-slate-400 hover:text-sky-500 transition text-sm">Redo</button>
                </div>
                <button class="bg-sky-500 text-white px-6 py-1.5 rounded-full text-xs font-bold hover:bg-sky-600 transition">Simpan Layout</button>
            </div>

            <div class="flex-1 canvas-dot m-8 bg-white shadow-inner rounded-3xl relative overflow-hidden flex items-center justify-center border-4 border-white">
                
                <div class="absolute top-32 left-40 w-56 bg-white p-3 shadow-xl rotate-[-4deg] border border-slate-100">
                    <div class="bg-sky-200/30 h-3 w-16 absolute -top-2 left-1/2 -translate-x-1/2 rotate-3"></div> <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&q=80&w=400" class="w-full aspect-square object-cover">
                    <p class="font-handwriting text-center mt-4 text-slate-600 text-xl">Hari Terakhir! 🎓</p>
                </div>

                <div class="absolute bottom-20 right-48 w-48 bg-white p-2 shadow-2xl rotate-[6deg] border border-slate-50 group cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=400" class="w-full aspect-square object-cover">
                    <p class="font-handwriting text-center mt-3 text-slate-500 text-sm">Kantin favorit...</p>
                </div>

                <div class="absolute top-20 right-80 text-4xl rotate-12 drop-shadow-md">⭐</div>
                
                <div class="absolute bottom-10 left-10 text-slate-300 text-xs font-medium uppercase tracking-[0.2em]">
                    Digital Studio v1.0 • Canvas Mode
                </div>
            </div>
        </main>
    </div>

</body>
</html>

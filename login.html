<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk ke DiScrap | Koleksi Kenangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8FAFC;
            background-image: radial-gradient(#E2E8F0 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .font-handwriting { font-family: 'Caveat', cursive; }
        
        .auth-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            transition: all 0.5s ease;
        }

        .input-field {
            border-bottom: 2px solid #F1F5F9;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #38BDF8;
        }

        .hidden-form {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-handwriting font-bold text-sky-500 mb-2">DiScrap.</h1>
            <p id="auth-subtitle" class="text-gray-400 text-sm italic">Selamat datang kembali di rumah kenanganmu.</p>
        </div>

        <div class="auth-card p-10 relative overflow-hidden">
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Email</label>
                    <input type="email" placeholder="kamu@email.com" class="w-full py-3 input-field bg-transparent text-gray-700 placeholder-gray-300">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Kata Sandi</label>
                    <input type="password" placeholder="••••••••" class="w-full py-3 input-field bg-transparent text-gray-700 placeholder-gray-300">
                </div>
                
                <div class="text-right">
                    <a href="#" class="text-xs text-sky-400 hover:underline">Lupa sandi?</a>
                </div>

                <button type="submit" class="w-full bg-sky-400 text-white py-4 rounded-xl font-bold shadow-lg shadow-sky-100 hover:bg-sky-500 hover:-translate-y-0.5 transition-all active:scale-95">
                    Masuk Sekarang
                </button>
            </form>

            <form id="register-form" class="space-y-5 hidden-form">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Nama Lengkap</label>
                    <input type="text" placeholder="Jane Doe" class="w-full py-3 input-field bg-transparent text-gray-700 placeholder-gray-300">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Email</label>
                    <input type="email" placeholder="kamu@email.com" class="w-full py-3 input-field bg-transparent text-gray-700 placeholder-gray-300">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Kata Sandi Baru</label>
                    <input type="password" placeholder="••••••••" class="w-full py-3 input-field bg-transparent text-gray-700 placeholder-gray-300">
                </div>

                <button type="submit" class="w-full bg-slate-800 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-slate-900 hover:-translate-y-0.5 transition-all active:scale-95">
                    Buat Akun
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-gray-50 text-center">
                <p id="toggle-text" class="text-sm text-gray-500">
                    Belum punya akun? 
                    <button onclick="toggleAuth()" class="text-sky-500 font-bold hover:underline ml-1">Daftar di sini</button>
                </p>
            </div>
        </div>

        <div class="text-center mt-8">
            <a href="index.html" class="text-xs text-gray-400 hover:text-gray-600 transition">← Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        let isLogin = true;

        function toggleAuth() {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const subtitle = document.getElementById('auth-subtitle');
            const toggleText = document.getElementById('toggle-text');

            if (isLogin) {
                // Switch to Register
                loginForm.classList.add('hidden-form');
                registerForm.classList.remove('hidden-form');
                subtitle.innerText = "Mari mulai perjalanan visualmu hari ini.";
                toggleText.innerHTML = 'Sudah punya akun? <button onclick="toggleAuth()" class="text-sky-500 font-bold hover:underline ml-1">Masuk di sini</button>';
            } else {
                // Switch to Login
                registerForm.classList.add('hidden-form');
                loginForm.classList.remove('hidden-form');
                subtitle.innerText = "Selamat datang kembali di rumah kenanganmu.";
                toggleText.innerHTML = 'Belum punya akun? <button onclick="toggleAuth()" class="text-sky-500 font-bold hover:underline ml-1">Daftar di sini</button>';
            }
            isLogin = !isLogin;
        }
    </script>
</body>
</html>
